services:
  reverse-proxy:
    image: nginx:alpine
    container_name: web-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - public-site
      - intranet-site
    networks:
      - web-network
    restart: unless-stopped

  public-site:
    image: nginx:alpine
    container_name: public-site
    volumes:
      - ./sites/public:/usr/share/nginx/html:ro
    networks:
      - web-network
    restart: unless-stopped

  intranet-site:
    image: nginx:alpine
    container_name: intranet-site
    volumes:
      - ./sites/intranet:/usr/share/nginx/html:ro
    networks:
      - web-network
    restart: unless-stopped

networks:
  web-network:
    driver: bridge
