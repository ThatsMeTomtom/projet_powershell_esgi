events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  upstream public_site {
    server public-site:80;
  }

  upstream intranet_site {
    server intranet-site:80;
  }

  server {
    listen 80 default_server;
    server_name _;
    return 301 http://public.local$request_uri;
  }

  server {
    listen 80;
    server_name public.gresy.edu;

    location / {
      proxy_pass http://public_site;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  server {
    listen 80;
    server_name intra.gresy.edu;

    location / {
      proxy_pass http://intranet_site;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
