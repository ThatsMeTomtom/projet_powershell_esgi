# DHCP Server Configuration

# Default lease time in seconds
default-lease-time 600;

# Maximum lease time in seconds
max-lease-time 7200;

# Authoritative DHCP server
authoritative;

# DHCP Subnet Declaration
subnet 10.10.0.0 netmask 255.255.0.0 {
    # Dynamic IP Pool
    range 10.10.1.0 10.10.254.254;

    # Gateway (router)
    option routers 10.10.0.1;

    # DNS Servers
    option domain-name-servers 8.8.8.8, 8.8.4.4;

    # Domain name
    option domain-name "local.domain";

    # Broadcast address
    option broadcast-address 10.10.255.255;
}

# Optional: Static IP assignment example
# host client-example {
#     hardware ethernet 00:11:22:33:44:55;
#     fixed-address 10.10.0.100;
# }
