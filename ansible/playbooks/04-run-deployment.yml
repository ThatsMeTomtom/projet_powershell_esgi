---
# Lance 01-Install-ADDS-DNS (reboot auto) puis 99-Deploy-All apres reconnexion

- name: Promotion AD DS
  hosts: windows
  gather_facts: false
  vars_files:
    - ../vars/main.yml
    - ../vars/vault.yml

  tasks:
    - name: Lancement 01-Install-ADDS-DNS.ps1
      ansible.windows.win_shell: |
        powershell.exe -ExecutionPolicy Bypass -File C:\deploiement\windows\01-Install-ADDS-DNS.ps1 `
          -DsmrPassword "{{ dsrm_password }}"
      async: 600
      poll: 10
      ignore_errors: true  # reboot coupe WinRM, erreur attendue

    - name: Attente reboot
      ansible.builtin.pause:
        seconds: 60

- name: Attente WinRM post-reboot
  hosts: windows_post_ad
  gather_facts: false
  vars_files:
    - ../vars/main.yml
    - ../vars/vault.yml

  tasks:
    - name: Attente WinRM (compte domaine)
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: "{{ winrm_port }}"
        timeout: "{{ reboot_wait_seconds }}"
        delay: 30
      delegate_to: localhost

    - name: Test connexion
      ansible.windows.win_ping:

    - name: Attente ADWS (Active Directory Web Services)
      ansible.windows.win_shell: |
        $i = 0
        do {
          Start-Sleep -Seconds 15
          $i++
          try { Get-ADDomain -ErrorAction Stop | Out-Null; break } catch {}
        } while ($i -lt 20)
      changed_when: false

- name: Deploiement complet
  hosts: windows_post_ad
  gather_facts: false
  vars_files:
    - ../vars/main.yml
    - ../vars/vault.yml

  tasks:
    - name: Lancement 99-Deploy-All.ps1
      ansible.windows.win_shell: |
        powershell.exe -ExecutionPolicy Bypass -File C:\deploiement\windows\99-Deploy-All.ps1
      args:
        chdir: C:\deploiement\windows
      async: 1800
      poll: 15
      vars:
        win_async_startup_timeout: 120
      register: deploy_result

    - name: Resultat
      ansible.builtin.debug:
        var: deploy_result.stdout_lines
